name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile bot
        run: python -m py_compile bot.py

      - name: Check bot registration
        run: python scripts/check_bot.py

      - name: Check site
        run: python scripts/check_site.py

      - name: Check JavaScript
        run: node --check app.js
